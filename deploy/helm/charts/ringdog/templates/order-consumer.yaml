apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.orderConsumer.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.orderConsumer.irsaRoleArn | default "" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-consumer
  namespace: {{ .Values.namespace }}
  labels:
    app: order-consumer
    {{- include "ringdog.ddLabels" (dict "env" .Values.datadog.env "service" "ringdog-order-consumer" "version" .Values.image.tag) | nindent 4 }}
spec:
  replicas: {{ .Values.orderConsumer.replicaCount }}
  selector:
    matchLabels:
      app: order-consumer
  template:
    metadata:
      labels:
        app: order-consumer
        {{- include "ringdog.ddLabels" (dict "env" .Values.datadog.env "service" "ringdog-order-consumer" "version" .Values.image.tag) | nindent 8 }}
      annotations:
        ad.datadoghq.com/order-consumer.logs: '[{"source":"nodejs","service":"ringdog-order-consumer"}]'
    spec:
      serviceAccountName: {{ .Values.orderConsumer.serviceAccountName }}
      containers:
        - name: order-consumer
          image: {{ include "ringdog.image" (dict "Values" .Values "repo" "ringdog-order-consumer") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ORDER_CONSUMER_HEALTH_PORT
              value: {{ .Values.orderConsumer.healthPort | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ringdog-app-secrets
                  key: databaseUrl
            - name: DD_ENV
              value: {{ .Values.datadog.env | quote }}
            - name: DD_SERVICE
              value: ringdog-order-consumer
            - name: DD_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_DATA_STREAMS_ENABLED
              value: "true"
            - name: DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
              value: "true"
            {{- range $key, $value := .Values.orderConsumer.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.orderConsumer.resources | nindent 12 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ringdog-app-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  databaseUrl: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  jwtSecret: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
