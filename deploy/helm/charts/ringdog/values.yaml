namespace: ringdog

image:
  registry: ""
  tag: latest
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: alb
  host: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /

frontend:
  replicaCount: 1
  port: 3000
  env:
    NEXT_PUBLIC_API_BASE_URL: ""
    NEXT_PUBLIC_CHATBOT_API_BASE_URL: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

backendApi:
  replicaCount: 1
  port: 4000
  serviceAccountName: backend-api
  # 시나리오 ② demo-deploy.yml이 --set으로 지정. 비우면 전역 image.tag(sha) 사용.
  # cd.yml 1차 helm upgrade는 --reuse-values가 없어 이 값을 다시 비운다.
  imageTag: ""
  version: ""
  # Pod당 Prisma 커넥션 풀 크기 (DATABASE_URL connection_limit). 최대 4 Pod × 10 = 40 < RDS max_connections.
  dbConnectionLimit: 10
  # HPA는 CPU 사용률 기준이므로 requests.cpu가 반드시 있어야 한다 (Task 8).
  # Graviton 실측 합계: 평시 200~350m, inject 중 850~930m. 100m이면 평시부터 4/4로 차서
  # 스케일 아웃 장면이 안 보인다.
  resources:
    requests: { cpu: 300m, memory: 256Mi }
    limits: { memory: 512Mi }
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    # 300m × 80% = Pod당 240m → 평시 1~2개, 장애 중 850m이면 4개.
    targetCPUUtilization: 80
  env:
    NODE_ENV: production
    CORS_ORIGIN: ""
    # MSK plaintext bootstrap brokers (terraform output: msk_bootstrap_brokers) and
    # OpenSearch domain endpoint (terraform output: opensearch_domain_endpoint, needs
    # an "https://" prefix). Both must be set at deploy time — the app falls back to
    # localhost otherwise, which doesn't exist in the cluster.
    KAFKA_BROKERS: ""
    OPENSEARCH_NODE: ""

chatbotService:
  replicaCount: 1
  port: 4001
  serviceAccountName: chatbot-service
  env:
    NODE_ENV: production
    BEDROCK_MOCK_MODE: "false"
    CORS_ORIGIN: ""
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 384Mi }

orderConsumer:
  replicaCount: 1
  healthPort: 4002
  serviceAccountName: order-consumer
  env:
    NODE_ENV: production
    # Same MSK bootstrap brokers as backendApi.env.KAFKA_BROKERS above.
    KAFKA_BROKERS: ""
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 384Mi }

# Non-secret runtime config — wire Secrets Manager via External Secrets in production.
secrets:
  databaseUrl: ""
  jwtSecret: ""

datadog:
  env: demo
  site: datadoghq.com
  # RUM app id / client token: not resolvable from AWS by fixed name like the
  # rest of cd.yml's deploy-time config, so set via GitHub Secrets instead
  # (same pattern as DD_API_KEY/DD_APP_KEY above) — empty here is a safe no-op,
  # see datadogRum.ts.
  rumApplicationId: ""
  rumClientToken: ""
  rumRemoteConfigurationId: ""

limitRange:
  defaultRequest: { cpu: 50m, memory: 64Mi }
  default: { memory: 512Mi }

# 시나리오 ① 기능 플래그 (문자열 "true"/"false")
featureFlags:
  trendingWidget: "false"

# 데모 트래픽 생성기 (k6). deploy/demo/demo-control.sh가 켜고 끄고 프로필을 바꾼다.
# targetUrl은 ALB 주소 — RUM은 브라우저가 Datadog으로 직접 보내므로 실제 외부 경로를 써야 함.
# 평시: rate 30 / users 5 / checkout 1, 급증(시나리오 ①): rate 240 / users 40 / checkout 0.25
trafficGen:
  enabled: false
  targetUrl: ""
  apiRatePerMin: 30
  apiUsers: 5
  checkoutRatio: "1"
  couponRatio: "0"
  trendingRatio: "1"
  ordersRatio: "1"
  browserRatePerMin: 2 # 봇 30% + 회원·비로그인 방문 섞임 → 결제 세션 약 1.3회/분
  image: grafana/k6:0.52.0
  browserImage: grafana/k6:0.52.0-with-browser
